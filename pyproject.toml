[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arkana"
version = "0.1.0"
description = "Arkana threat intelligence backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0"
]

[tool.setuptools.packages.find]
include = ["arkana*"]