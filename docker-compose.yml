services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arkana
      POSTGRES_PASSWORD: arkana
      POSTGRES_DB: arkana
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkana -d arkana"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://arkana:arkana@db:5432/arkana
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn arkana.api.main:app --host 0.0.0.0 --port 8000 --reload

  test:
    build:
      context: .
      target: dev
    command: pytest -v --cov=arkana --cov-report=term-missing
    # Add depends_on db when integration tests require a live Postgres instance.

volumes:
  postgres_data:
